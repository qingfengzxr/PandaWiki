services:
  caddy:
    container_name: panda-wiki-caddy
    image: chaitin-registry.cn-hangzhou.cr.aliyuncs.com/chaitin/panda-wiki-caddy:2.10-alpine
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    environment:
      - CADDY_ADMIN=unix//var/run/caddy/caddy-admin.sock
    volumes:
      - ./data/caddy/caddy_config:/config
      - ./data/caddy/caddy_data:/data
      - ./data/caddy/run:/var/run/caddy
    network_mode: host

  postgres:
    container_name: panda-wiki-postgres
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: panda-wiki
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-panda-wiki-secret}
      POSTGRES_DB: panda-wiki
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U panda-wiki -d panda-wiki"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      panda-wiki:
        ipv4_address: "${SUBNET_PREFIX:-169.254.15}.10"
        aliases:
          - panda-wiki-postgres
    ports:
      - "5432:5432"

  redis:
    container_name: panda-wiki-redis
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-panda-wiki-redis-secret}", "--appendonly", "yes", "--appendfilename", "appendonly.aof", "--save", "900 1", "--save", "300 10", "--save", "60 10000"]
    restart: unless-stopped
    volumes:
      - redis_data:/data
    networks:
      panda-wiki:
        ipv4_address: "${SUBNET_PREFIX:-169.254.15}.11"
        aliases:
          - panda-wiki-redis
    ports:
      - "6379:6379"

  minio:
    container_name: panda-wiki-minio
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    restart: unless-stopped
    command: ["minio", "server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: s3panda-wiki
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-panda-wiki-s3-secret}
    volumes:
      - minio_data:/data
    networks:
      panda-wiki:
        ipv4_address: "${SUBNET_PREFIX:-169.254.15}.12"
        aliases:
          - panda-wiki-minio
    ports:
      - "9000:9000"
      - "9001:9001"

  nats:
    container_name: panda-wiki-nats
    image: nats:2.11-alpine
    restart: unless-stopped
    command: ["nats-server", "--user", "panda-wiki", "--pass", "${NATS_PASSWORD:-panda-wiki-nats-secret}"]
    networks:
      panda-wiki:
        ipv4_address: "${SUBNET_PREFIX:-169.254.15}.13"
        aliases:
          - panda-wiki-nats
    ports:
      - "4222:4222"

  qdrant:
    container_name: panda-wiki-qdrant
    image: qdrant/qdrant:v1.14.1
    restart: unless-stopped
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY:-panda-wiki-qdrant-secret}
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      panda-wiki:
        ipv4_address: "${SUBNET_PREFIX:-169.254.15}.14"
        aliases:
          - panda-wiki-qdrant
    ports:
      - "6333:6333"

  raglite:
    container_name: panda-wiki-raglite
    image: chaitin-registry.cn-hangzhou.cr.aliyuncs.com/chaitin/panda-wiki-raglite:1-3-8
    restart: unless-stopped
    depends_on:
      - postgres
      - minio
      - qdrant
    environment:
      GIN_MODE: release
      DATABASE_HOST: panda-wiki-postgres
      DATABASE_USER: panda-wiki
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-panda-wiki-secret}
      MINIO_HOST: panda-wiki-minio:9000
      MINIO_USER: s3panda-wiki
      MINIO_PASSWORD: ${S3_SECRET_KEY:-panda-wiki-s3-secret}
      QDRANT_HOST: panda-wiki-qdrant
      QDRANT_API_KEY: ${QDRANT_API_KEY:-panda-wiki-qdrant-secret}
    volumes:
      - raglite_data:/data
    networks:
      panda-wiki:
        ipv4_address: "${SUBNET_PREFIX:-169.254.15}.18"
        aliases:
          - panda-wiki-raglite

  api:
    container_name: panda-wiki-api
    build:
      context: ./backend
      dockerfile: Dockerfile.api
      args:
        VERSION: local
    depends_on:
      caddy:
        condition: service_started
      postgres:
        condition: service_healthy
      nats:
        condition: service_started
      redis:
        condition: service_started
      minio:
        condition: service_started
      qdrant:
        condition: service_started
      raglite:
        condition: service_started
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-panda-wiki-secret}
      NATS_PASSWORD: ${NATS_PASSWORD:-panda-wiki-nats-secret}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-panda-wiki-redis-secret}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-panda-wiki-s3-secret}
      JWT_SECRET: ${JWT_SECRET:-panda-wiki-jwt-secret}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123456}
      QDRANT_API_KEY: ${QDRANT_API_KEY:-panda-wiki-qdrant-secret}
      SUBNET_PREFIX: ${SUBNET_PREFIX:-169.254.15}
    volumes:
      - api_data:/data
      - ./data/caddy/run:/app/run
    networks:
      panda-wiki:
        ipv4_address: "${SUBNET_PREFIX:-169.254.15}.2"
        aliases:
          - panda-wiki-api
    ports:
      - "8000:8000"

  consumer:
    container_name: panda-wiki-consumer
    build:
      context: ./backend
      dockerfile: Dockerfile.consumer
    depends_on:
      - api
      - nats
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-panda-wiki-secret}
      NATS_PASSWORD: ${NATS_PASSWORD:-panda-wiki-nats-secret}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-panda-wiki-redis-secret}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-panda-wiki-s3-secret}
      JWT_SECRET: ${JWT_SECRET:-panda-wiki-jwt-secret}
      QDRANT_API_KEY: ${QDRANT_API_KEY:-panda-wiki-qdrant-secret}
    networks:
      panda-wiki:
        ipv4_address: "${SUBNET_PREFIX:-169.254.15}.3"
        aliases:
          - panda-wiki-consumer

  admin:
    container_name: panda-wiki-admin
    build:
      context: ./web
      dockerfile: admin/Dockerfile.local
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://panda-wiki-api:8000}
    depends_on:
      - api
    ports:
      - "8080:80"
    networks:
      panda-wiki:
        ipv4_address: "${SUBNET_PREFIX:-169.254.15}.111"
        aliases:
          - panda-wiki-admin

  app:
    container_name: panda-wiki-app
    build:
      context: ./web
      dockerfile: app/Dockerfile.local
      args:
        TARGET: ${TARGET:-http://panda-wiki-api:8000}
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://panda-wiki-api:8000}
    depends_on:
      - api
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://panda-wiki-api:8000}
      TARGET: ${TARGET:-http://panda-wiki-api:8000}
    ports:
      - "3010:3010"
    networks:
      panda-wiki:
        ipv4_address: "${SUBNET_PREFIX:-169.254.15}.112"
        aliases:
          - panda-wiki-app

networks:
  panda-wiki:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: "${SUBNET_PREFIX:-169.254.15}.0/24"

volumes:
  postgres_data:
  redis_data:
  minio_data:
  qdrant_data:
  raglite_data:
  api_data:
